[build-system]
requires = ["scikit-build-core", "pybind11", "cmake", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "packaide"
version = "0.1.0"
description = "Irregular bin packing solver"
authors = [{name="Justin Geeslin"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.scikit-build]
cmake.minimum-version = "3.15"
build-dir = "build/{wheel_tag}"